[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmfit-global"
version = "0.1.0"
description = "Global fitting of multi-component, multi-dataset models built on top of lmfit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["fitting", "lmfit", "spectroscopy", "streamlit"]
authors = [
    { name = "Muhammad Maikudi Isah", email = "muhammadmaikudi.isah@gmail.com" }
]

dependencies = [
    "numpy",
    "lmfit",
    "scipy",
]

[project.optional-dependencies]
plot = ["matplotlib", "palettable"]
ml = ["scikit-learn"]
gui = ["streamlit>=1.30.0", "matplotlib", "pandas"]

[project.scripts]
lmfitgedit = "gui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmfit_global", "lmfit_global.*", "gui", "gui.*"]

[tool.setuptools.package-data]
"gui" = ["**/*"]